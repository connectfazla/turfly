services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: turf
      POSTGRES_PASSWORD: turf
      POSTGRES_DB: turf_booking
    ports:
      - "5432:5432"
    volumes:
      - turf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turf -d turf_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  turf_postgres_data:
